# Sveltia CMS configuration
# Docs: https://sveltiacms.app/  ·  Field names mirror the Jekyll front-matter.

backend:
  name: github
  repo: kuanstreetwear/kuanstreetwear.github.io
  branch: main
  # Auth: Sveltia signs in with a GitHub Personal Access Token by default
  # (no OAuth app needed). To enable the one-click "Sign in with GitHub"
  # button instead, deploy sveltia-cms-auth and set:
  # base_url: https://your-auth-worker.example.workers.dev

# Uploaded images land here and are referenced from the site root.
media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  # ── BLOG ─────────────────────────────────────────────────────────────
  - name: blog
    label: Blog
    label_singular: Post
    folder: _blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}  ·  № {{number}}  ·  {{date}}"
    sortable_fields: [date, number, title]
    fields:
      - { name: published, label: "Published (uncheck to keep as draft)", widget: boolean, default: true }
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: number, label: "Index № (e.g. 04)", widget: string }
      - { name: glyph, label: "Glyph (e.g. 白)", widget: string }
      - { name: location, label: Location, widget: string, default: "Sài Gòn" }
      - { name: tags, label: Tags, widget: list, default: [] }
      - { name: excerpt, label: Excerpt (shown on the listing), widget: text }
      - { name: cover, label: Cover image, widget: image, required: false, hint: "Upload, or paste an external URL" }
      - { name: cover_code, label: Cover label code, widget: string, required: false }
      - { name: description, label: SEO description, widget: text, required: false }
      - { name: og_description, label: Social-share description, widget: text, required: false }
      - { name: body, label: Body, widget: markdown }

  # ── PROJECTS ─────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    label_singular: Project
    folder: _projects
    create: true
    slug: "{{fields.code | lower}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{code}}  ·  {{title}}  ·  {{year}}"
    sortable_fields: [code, year, title]
    fields:
      - { name: published, label: "Published (uncheck to keep as draft)", widget: boolean, default: true }
      - { name: title, label: Title, widget: string }
      - { name: code, label: "Code (e.g. KSW-001)", widget: string }
      - { name: number, label: "Number (e.g. 001)", widget: string }
      - { name: year, label: Year, widget: string }
      - { name: glyph, label: "Glyph (e.g. 区)", widget: string }
      - { name: location, label: Location, widget: string, default: "Sài Gòn, VN" }
      - { name: tags, label: Tags, widget: list, default: [] }
      - { name: summary, label: Summary (page header), widget: text }
      - { name: excerpt, label: Card description (listing), widget: text }
      - { name: cover, label: Cover image (16:9), widget: image, required: false, hint: "Upload, or paste an external URL" }
      - { name: cover_code, label: Cover label code, widget: string, required: false }
      - { name: card_image, label: Card image (3:4, listing), widget: image, required: false }
      - { name: card_code, label: Card label code, widget: string, required: false }
      - { name: base_item, label: "Spec — Base item", widget: string, required: false }
      - { name: material, label: "Spec — Material", widget: string, required: false }
      - { name: process, label: "Spec — Process", widget: string, required: false }
      - { name: origin, label: "Spec — Origin", widget: string, required: false, default: "Sài Gòn, Việt Nam" }
      - { name: status, label: "Spec — Status", widget: string, required: false, default: "Archived" }
      - { name: aside_label, label: Sidebar label, widget: string, required: false }
      - name: gallery
        label: Gallery
        widget: list
        required: false
        label_singular: Frame
        summary: "{{fields.code}} — {{fields.image}}"
        fields:
          - { name: image, label: Image, widget: image }
          - { name: glyph, label: Glyph, widget: string, required: false }
          - { name: code, label: Label code, widget: string, required: false }
      - { name: description, label: SEO description, widget: text, required: false }
      - { name: og_description, label: Social-share description, widget: text, required: false }
      - { name: body, label: Body, widget: markdown }

  # ── PAGES (fixed-file pages) ─────────────────────────────────────────
  - name: pages
    label: Pages
    editor: { preview: false }
    files:
      - name: about
        label: About
        file: about.md
        fields:
          - { name: layout, widget: hidden, default: about }
          - { name: active, widget: hidden, default: about }
          - { name: permalink, widget: hidden, default: /about/ }
          - { name: seo_title, label: SEO title, widget: string }
          - { name: description, label: SEO description, widget: text, required: false }
          - { name: og_description, label: Social-share description, widget: text, required: false }
          - { name: intro, label: Intro line (under the heading), widget: text }
          - { name: portrait, label: Portrait image, widget: image, required: false }
          - { name: portrait_code, label: Portrait label code, widget: string, required: false }
          - { name: summary_points, label: Project summary bullets, widget: list, field: { name: point, label: Point, widget: string } }
          - { name: body, label: Body, widget: markdown }
      - name: story
        label: Story
        file: story.md
        fields:
          - { name: layout, widget: hidden, default: story }
          - { name: active, widget: hidden, default: story }
          - { name: permalink, widget: hidden, default: /story/ }
          - { name: og_type, widget: hidden, default: article }
          - { name: seo_title, label: SEO title, widget: string }
          - { name: description, label: SEO description, widget: text, required: false }
          - { name: og_description, label: Social-share description, widget: text, required: false }
          - { name: intro, label: Intro line (under the heading), widget: text }
          - { name: origin_image, label: Sidebar image, widget: image, required: false }
          - { name: origin_glyph, label: "Sidebar glyph (e.g. 起)", widget: string, required: false }
          - { name: origin_code, label: Sidebar label code, widget: string, required: false }
          - { name: started, label: "Spec — Started", widget: string, required: false }
          - { name: restarted, label: "Spec — Restarted", widget: string, required: false }
          - { name: format, label: "Spec — Format", widget: string, required: false }
          - { name: focus, label: "Spec — Focus", widget: string, required: false }
          - { name: body, label: Body, widget: markdown }

  # ── SITE SETTINGS ────────────────────────────────────────────────────
  - name: settings
    label: Site
    files:
      - name: contact
        label: Contacts & Footer
        file: _data/site.yml
        fields:
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: instagram_handle, label: Instagram handle, widget: string }
              - { name: instagram_url, label: Instagram URL, widget: string }
              - { name: email, label: Email, widget: string }
              - { name: telegram_handle, label: Telegram handle, widget: string }
              - { name: telegram_url, label: Telegram URL, widget: string }
          - name: location
            label: Location
            widget: object
            fields:
              - { name: place, label: Place, widget: string }
              - { name: coordinates, label: Coordinates, widget: string }
              - { name: district, label: District, widget: string }
              - { name: since, label: Since (year), widget: string }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: about, label: Footer "About" blurb, widget: text }
